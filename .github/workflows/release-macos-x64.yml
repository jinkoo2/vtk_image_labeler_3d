name: Release (macOS x64)

# Runs after primary platforms finish so the slow Intel Mac build
# does not block Windows / Linux / macOS-arm64 release publishing.
on:
  workflow_run:
    workflows: ["Release (Primary Platforms)"]
    types:
      - completed

permissions:
  contents: write
  actions: read

concurrency:
  group: release-macos-x64-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  build-and-deploy-macos-x64:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-13
    steps:
      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-meta
          path: meta
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read release tag
        id: meta
        run: |
          set -euo pipefail
          TAG="$(tr -d '\r\n' < meta/tag.txt)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.1.3"
          python -m poetry config virtualenvs.create true
          python -m poetry config virtualenvs.in-project true
          python -m poetry --version

      - name: Install dependencies
        run: python -m poetry install --no-interaction --no-ansi

      - name: Install PyInstaller
        run: |
          PY=".venv/bin/python"
          test -x "$PY"
          "$PY" -c "import sys; print(sys.executable)"
          "$PY" -m pip install "pyinstaller>=6.3,<7"

      - name: Ensure default settings.json exists
        run: |
          if [ ! -f settings.json ]; then
            cat > settings.json <<'EOF'
          {
            "log_dir": "_logs",
            "temp_dir": "_temp",
            "nnunet_server_url": "https://nnunet-server-01.apps.myphysics.net/api/v3",
            "keycloak_url": "https://login.apps.myphysics.net",
            "keycloak_realm": "myphysics",
            "keycloak_registration_url": ""
          }
          EOF
          fi

      - name: Build with PyInstaller
        run: .venv/bin/python -m PyInstaller packaging/app.spec --noconfirm --clean

      - name: Stage package
        run: |
          set -euo pipefail
          STAGE="dist/stage/ImageLabeler3D-macos-x64"
          mkdir -p "$STAGE"
          cp -R dist/ImageLabeler3D/. "$STAGE/"
          if [ -f settings.json ]; then
            cp settings.json "$STAGE/settings.json"
          fi
          cp packaging/run_mac.command "$STAGE/run_mac.command"
          chmod +x "$STAGE/run_mac.command" "$STAGE/ImageLabeler3D"
          cat > "$STAGE/README_RUN.txt" <<'EOF'
          Image Labeler 3D (macOS)
          ------------------------
          Gatekeeper often blocks unsigned PyInstaller builds downloaded from the
          internet with: "Python.framework" is damaged and can't be opened.

          Easiest: double-click run_mac.command (clears quarantine and launches).

          Or in Terminal (from this folder):
            xattr -cr .
            chmod +x ./ImageLabeler3D
            ./ImageLabeler3D

          Then edit settings.json or use Edit -> Preferences for server URLs.
          Logs: _logs/   Temp: _temp/
          EOF

      - name: Ad-hoc codesign (macOS)
        run: |
          set -euo pipefail
          STAGE="dist/stage/ImageLabeler3D-macos-x64"
          codesign --force --deep --sign - "$STAGE/ImageLabeler3D"
          FW=$(find "$STAGE" -type d -name 'Python.framework' | head -n 1 || true)
          if [ -n "$FW" ]; then
            codesign --force --deep --sign - "$FW"
          fi
          codesign --verify --deep --strict "$STAGE/ImageLabeler3D" || true

      - name: Smoke-test frozen app
        run: |
          set -euo pipefail
          STAGE="dist/stage/ImageLabeler3D-macos-x64"
          export QT_QPA_PLATFORM=offscreen
          python packaging/run_smoke_test.py "$STAGE" --timeout 120
          rm -f "$STAGE/smoke_result.txt"

      - name: Compress package
        run: |
          cd dist/stage
          tar -czf "../ImageLabeler3D-macos-x64.tar.gz" "ImageLabeler3D-macos-x64"

      - name: Append to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: dist/ImageLabeler3D-macos-x64.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
