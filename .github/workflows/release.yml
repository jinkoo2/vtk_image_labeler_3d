name: Release (Primary Platforms)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create/use (e.g. v0.1.0). Leave empty to use run id."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-primary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            shell: pwsh
          - os: ubuntu-latest
            artifact: linux-x64
            shell: bash
          - os: macos-latest
            artifact: macos-arm64
            shell: bash

    defaults:
      run:
        # Git Bash + Poetry on Windows often fails with
        # "The system cannot find the file specified" for poetry run.
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Qt/OpenGL libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxi6 \
            xvfb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        # pip install + python -m poetry works under both bash and pwsh.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.1.3"
          python -m poetry config virtualenvs.create true
          python -m poetry config virtualenvs.in-project true
          python -m poetry --version

      - name: Add Poetry to PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: python -m poetry install --no-interaction --no-ansi

      - name: Install PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $py = Join-Path $PWD ".venv/Scripts/python.exe"
          if (-not (Test-Path $py)) { throw "Missing venv python: $py" }
          & $py -c "import sys; print(sys.executable)"
          & $py -m pip install "pyinstaller>=6.3,<7"

      - name: Install PyInstaller (Unix)
        if: runner.os != 'Windows'
        run: |
          PY=".venv/bin/python"
          test -x "$PY"
          "$PY" -c "import sys; print(sys.executable)"
          "$PY" -m pip install "pyinstaller>=6.3,<7"

      - name: Ensure default settings.json exists
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path settings.json)) {
            $obj = [ordered]@{
              log_dir = "_logs"
              temp_dir = "_temp"
              nnunet_server_url = "https://nnunet-server-01.apps.myphysics.net/api/v3"
              keycloak_url = "https://login.apps.myphysics.net"
              keycloak_realm = "myphysics"
              keycloak_registration_url = ""
            }
            $obj | ConvertTo-Json | Set-Content -Encoding utf8 settings.json
          }

      - name: Ensure default settings.json exists
        if: runner.os != 'Windows'
        run: |
          if [ ! -f settings.json ]; then
            cat > settings.json <<'EOF'
          {
            "log_dir": "_logs",
            "temp_dir": "_temp",
            "nnunet_server_url": "https://nnunet-server-01.apps.myphysics.net/api/v3",
            "keycloak_url": "https://login.apps.myphysics.net",
            "keycloak_realm": "myphysics",
            "keycloak_registration_url": ""
          }
          EOF
          fi

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $py = Join-Path $PWD ".venv/Scripts/python.exe"
          & $py -m PyInstaller packaging/app.spec --noconfirm --clean

      - name: Build with PyInstaller (Unix)
        if: runner.os != 'Windows'
        run: |
          .venv/bin/python -m PyInstaller packaging/app.spec --noconfirm --clean

      - name: Stage package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "dist/stage/ImageLabeler3D-${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path "dist/ImageLabeler3D\*" -Destination $stage -Recurse -Force
          if (Test-Path settings.json) {
            Copy-Item settings.json (Join-Path $stage "settings.json") -Force
          }
          @(
            "Image Labeler 3D",
            "----------------",
            "1. Unzip/extract this folder.",
            "2. Run ImageLabeler3D (ImageLabeler3D.exe on Windows).",
            "3. Edit settings.json or use Edit -> Preferences for server URLs.",
            "Logs: _logs/   Temp: _temp/"
          ) | Set-Content -Encoding utf8 (Join-Path $stage "README_RUN.txt")

      - name: Stage package (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          STAGE="dist/stage/ImageLabeler3D-${{ matrix.artifact }}"
          mkdir -p "$STAGE"
          cp -R dist/ImageLabeler3D/. "$STAGE/"
          if [ -f settings.json ]; then
            cp settings.json "$STAGE/settings.json"
          fi
          cat > "$STAGE/README_RUN.txt" <<'EOF'
          Image Labeler 3D
          ----------------
          1. Unzip/extract this folder.
          2. Run ImageLabeler3D (ImageLabeler3D.exe on Windows).
          3. Edit settings.json or use Edit -> Preferences for server URLs.
          Logs: _logs/   Temp: _temp/
          EOF

      - name: Smoke-test frozen app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "dist/stage/ImageLabeler3D-${{ matrix.artifact }}"
          $env:QT_QPA_PLATFORM = "offscreen"
          python packaging/run_smoke_test.py $stage --timeout 120
          # Keep packages clean for end users.
          Remove-Item (Join-Path $stage "smoke_result.txt") -ErrorAction SilentlyContinue

      - name: Smoke-test frozen app (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          STAGE="dist/stage/ImageLabeler3D-${{ matrix.artifact }}"
          export QT_QPA_PLATFORM=offscreen
          XVFB_FLAG=""
          if [ "${{ runner.os }}" = "Linux" ]; then
            XVFB_FLAG="--xvfb"
          fi
          python packaging/run_smoke_test.py "$STAGE" --timeout 120 $XVFB_FLAG
          rm -f "$STAGE/smoke_result.txt"

      - name: Compress package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/stage/ImageLabeler3D-${{ matrix.artifact }}" -DestinationPath "dist/ImageLabeler3D-${{ matrix.artifact }}.zip" -Force

      - name: Compress package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist/stage
          tar -czf "../ImageLabeler3D-${{ matrix.artifact }}.tar.gz" "ImageLabeler3D-${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageLabeler3D-${{ matrix.artifact }}
          path: dist/ImageLabeler3D-${{ matrix.artifact }}.*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten assets
        run: |
          set -euo pipefail
          mkdir -p upload
          find release-assets -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp -v {} upload/ \;
          ls -lah upload

      - name: Resolve tag name
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            if [ -z "$TAG" ]; then
              TAG="build-${{ github.run_number }}"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"
          mkdir -p meta
          printf '%s\n' "$TAG" > meta/tag.txt
          printf '%s\n' "${{ github.sha }}" > meta/sha.txt

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-meta
          path: meta/
          if-no-files-found: error
          retention-days: 14

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Image Labeler 3D ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name == '' }}
          generate_release_notes: true
          files: upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
