name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create/use (e.g. v0.1.0). Leave empty to use run id."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: ubuntu-latest
            artifact: linux-x64
          - os: macos-latest
            artifact: macos-arm64
          # Intel Macs (x86_64). macos-13 is the current GitHub Intel runner.
          - os: macos-13
            artifact: macos-x64

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Qt/OpenGL libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxi6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.1.3"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Install PyInstaller
        run: poetry run pip install "pyinstaller>=6.3,<7"

      - name: Ensure default settings.json exists
        run: |
          if [ ! -f settings.json ]; then
            cat > settings.json <<'EOF'
          {
            "log_dir": "_logs",
            "temp_dir": "_temp",
            "nnunet_server_url": "https://nnunet-server-01.apps.myphysics.net/api/v3",
            "keycloak_url": "https://login.apps.myphysics.net",
            "keycloak_realm": "myphysics",
            "keycloak_registration_url": ""
          }
          EOF
          fi

      - name: Build with PyInstaller
        run: poetry run pyinstaller packaging/app.spec --noconfirm --clean

      - name: Stage package
        run: |
          set -euo pipefail
          STAGE="dist/stage/ImageLabeler3D-${{ matrix.artifact }}"
          mkdir -p "$STAGE"
          cp -a dist/ImageLabeler3D/. "$STAGE/"
          if [ -f settings.json ]; then
            cp settings.json "$STAGE/settings.json"
          fi
          cat > "$STAGE/README_RUN.txt" <<'EOF'
          Image Labeler 3D
          ----------------
          1. Unzip/extract this folder.
          2. Run ImageLabeler3D (ImageLabeler3D.exe on Windows).
          3. Edit settings.json or use Edit -> Preferences for server/Keycloak URLs.
          Logs: _logs/   Temp: _temp/
          EOF

      - name: Compress package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist/stage
          powershell -Command "Compress-Archive -Path 'ImageLabeler3D-${{ matrix.artifact }}' -DestinationPath '../ImageLabeler3D-${{ matrix.artifact }}.zip' -Force"

      - name: Compress package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist/stage
          tar -czf "../ImageLabeler3D-${{ matrix.artifact }}.tar.gz" "ImageLabeler3D-${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageLabeler3D-${{ matrix.artifact }}
          path: dist/ImageLabeler3D-${{ matrix.artifact }}.*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten assets
        run: |
          set -euo pipefail
          mkdir -p upload
          find release-assets -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp -v {} upload/ \;
          ls -lah upload

      - name: Resolve tag name
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            if [ -z "$TAG" ]; then
              TAG="build-${{ github.run_number }}"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Image Labeler 3D ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name == '' }}
          generate_release_notes: true
          files: upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
